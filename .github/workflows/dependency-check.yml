name: Dependency check

# Once a month: install the newest versions allowed by pyproject.toml (ignoring
# the lock files) and run all checks. Nothing is changed in the repository.
# The run summary lists which pinned packages have newer versions; if the
# checks fail with them, an issue labelled "dependencies" is opened (or
# commented on), so updating the locks never happens blindly.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:       # "Run workflow" button on the Actions page

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the newest allowed versions (no lock file)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -e ".[dev,llm,desktop]"

      - name: Compare with the lock file
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import re
          from importlib.metadata import distributions

          pins = {}
          for line in open("requirements-dev.txt", encoding="utf-8"):
              m = re.match(r"^([A-Za-z0-9_.-]+)==([^\s;]+)", line)
              if m:
                  pins[m[1].lower().replace("_", "-")] = m[2]
          installed = {d.metadata["Name"].lower().replace("_", "-"): d.version for d in distributions()}
          changed = sorted((n, v, installed[n]) for n, v in pins.items() if n in installed and installed[n] != v)
          print(f"### Python ${{ matrix.python-version }}: {len(changed)} package(s) newer than the lock\n")
          if changed:
              print("| Package | Locked | Latest allowed |\n|---|---|---|")
              for name, old, new in changed:
                  print(f"| {name} | {old} | {new} |")
          EOF

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest --cov

      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PY: ${{ matrix.python-version }}
        run: |
          title="Newest dependency versions break the checks"
          body="The monthly dependency check failed on Python $PY with the newest allowed versions: $RUN_URL. The lock files are unchanged, so the app itself is unaffected. Fix or cap the offending package before regenerating the locks."
          gh label create dependencies --color 0366d6 --force >/dev/null 2>&1 || true
          number=$(gh issue list --label dependencies --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label dependencies --body "$body"
          fi
